<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
        }
      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 10px;
        max-width: 200px;
       

      }
     input{
        background-color: rgb(151, 145, 145);
        margin-bottom: 10px;
        min-height: 25px;
     }
     main{
        display: flex;
        flex-direction: column;
        max-width: 200px;
        background-color: rgb(28, 27, 27);
        padding: 5px 5px;
     }
     #display{
        color: black;
        font-weight: bolder;
        font-size: 2rem;
     }
     .btn:hover{
        background-color: rgb(168, 215, 239);
     }
    .btnd:hover{
        background-color: rgb(245, 81, 55);
     }
    .btnans:hover{
        background-color: rgb(68, 245, 55);
     }
    </style>
  </head>
  <body>
    <main>

 
    <input id="display" type="text" disabled />
    <div class="buttons">
      <button onclick="clearValue('AC')" class="btnd">AC</button>
      <button onclick="appendValue('*')" class="btn">*</button>
      <button onclick="appendValue('+')" class="btn">+</button>
      <button onclick="appendValue('-')" class="btn">-</button>

      <button onclick="appendValue('9')" class="btn">9</button>
      <button onclick="appendValue('8')" class="btn">8</button>
      <button onclick="appendValue('7')" class="btn">7</button>
      <button onclick="appendValue('/')" class="btn">/</button>

      <button onclick="appendValue('6')" class="btn">6</button>
      <button onclick="appendValue('5')" class="btn">5</button>
      <button onclick="appendValue('4')" class="btn">4</button>
      <button onclick="appendValue('0')" class="btn">0</button>

      <button onclick="appendValue('3')" class="btn">3</button>
      <button onclick="appendValue('2')" class="btn">2</button>
      <button onclick="appendValue('1')" class="btn">1</button>
      <button onclick="calculate('=')" class="btnans">=</button>
    </div>
     </main>
    <script>
      const display = document.getElementById("display");
      function appendValue(value) {
        display.value += value;
      }
      function clearValue(value) {
        display.value = " ";
      }
      function calculate(value) {
        try {
          display.value = eval(display.value);
        } catch {
          display.value = "error";
        }
      }
    </script>
  </body>
</html>
