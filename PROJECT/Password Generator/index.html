<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>generate <br>Password <hr></h1>
        <div class="display">
            <input id="pass" type="text" placeholder="password">
            <img onclick="copyPassword()" class="copyimg" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsfEae_aPRDjGld7zL9jOqcP01QLH-bAC-f3u4gkJtow&s=10" alt="">
        </div>
        <button onclick="createPassword()"><img src="" alt="">Generate Password</button>
    </main>
    <script>
        const password =document.getElementById("pass")
        const length =10;
        
        const upperCase ="ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        const lowerCase ="abcdefghijklmnopqrstuvwxyz"
        const number ="1234567890"
        const symbol="!@#$%^&*?"
        const allChars = upperCase + lowerCase + number + symbol
        function createPassword(){
            let passwords ='';
            passwords+= upperCase[Math.floor(Math.random()* upperCase.length)]
            passwords+= lowerCase[Math.floor(Math.random()* lowerCase.length)]
            passwords+= number[Math.floor(Math.random()* number.length)]
            passwords+= symbol[Math.floor(Math.random()* symbol.length)]
      
        while(length > passwords.length){
                passwords+= allChars[Math.floor(Math.random()* allChars.length)]
        }
        password.value = passwords
          }
          function copyPassword(){
            password.select();
            document.execCommand("copy")
          }
    </script>
</body>
</html>
